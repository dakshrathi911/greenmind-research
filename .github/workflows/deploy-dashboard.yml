name: Deploy GreenMind AI dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "research/results/matched_service_scenario_summary.csv"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare static dashboard
        run: |
          mkdir -p _site/dashboard _site/research/results
          cp dashboard/index.html _site/dashboard/index.html
          cp research/results/matched_service_scenario_summary.csv _site/research/results/
          cp research/results/matched_service_analysis_report.md _site/research/results/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
